# IOApp.cfg
# Per-category list of Profibus block addresses to skip during read/write.
#
# Each line is `key=value`. Lines starting with # and blank lines are ignored.
# Values are either:
#   <empty>             - nothing skipped (normal operation)
#   N[,N,...]           - skip these specific block addresses
#   all                 - skip every block in this category
#
# Reload happens on every Start click, so you can edit this file and re-Start
# the I/O App without exiting VB6 or rebuilding the EXE.
#
# Card A block address ranges (per IOTypes_App.bas):
#   AI: 50-54     DI: 80-93     AO: 1-42     DO: 60-78
# Card B block address ranges:
#   AI: 20-21     DI: 45-56     AO: 1-18     DO: 25-37

# Profibus analog input blocks at CMA are known broken; skip them entirely.
# If they ever get fixed, change the value back to empty.
cardA_ai_skip=all
cardA_di_skip=
cardA_ao_skip=
cardA_do_skip=

cardB_ai_skip=all
cardB_di_skip=
cardB_ao_skip=
cardB_do_skip=
